name: Python versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test_python:
    name: Python ${{ matrix.python }}, ${{ matrix.pyarrow && 'with' || 'without' }} pyarrow
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python: without pyarrow and before 3.12 COPY is not used, the staging table loads row by row.
          - {python: '3.10', pyarrow: false, engines: 'sqlite,postgres'}
          # Without pyarrow on 3.12+: COPY writes its CSV with the csv module, DuckDB loads row by row.
          - {python: '3.12', pyarrow: false, engines: 'sqlite,duckdb,postgres,postgres-psycopg,postgres-pg8000'}
          # The newest Python.
          - {python: '3.15', pyarrow: true, engines: 'sqlite,duckdb,postgres'}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbmerge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Not "uv sync": uv.lock pins packages that have no wheels for every Python here (pyarrow 25, pyodbc
      # on 3.15), and its dev extra brings pyarrow in. The latest releases are installed instead, as a user
      # of that Python gets them. scramp 1.5.0 breaks pg8000 1.31.5.
      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e . pytest pandas polars numpy duckdb_engine psycopg2-binary "psycopg[binary]" pg8000 "scramp<1.5"
          if [ "${{ matrix.pyarrow }}" = "true" ]; then uv pip install pyarrow; fi

      - name: Show versions
        run: |
          uv run --no-sync python -c "import sys, importlib.util, sqlalchemy, pandas, polars; print(sys.version, 'SQLAlchemy', sqlalchemy.__version__, 'pandas', pandas.__version__, 'polars', polars.__version__, 'pyarrow', importlib.util.find_spec('pyarrow') is not None)"
          uv run --no-sync python -c "import importlib.util; assert (importlib.util.find_spec('pyarrow') is not None) == ${{ matrix.pyarrow && 'True' || 'False' }}"

      - name: Create data directory
        run: mkdir -p data

      - name: Initialize sample data
        run: |
          uv run --no-sync python tests/sample_data_in_sqlite.py

      - name: Run pytest
        env:
          DBMERGE_TEST_ENGINES: ${{ matrix.engines }}
        run: |
          uv run --no-sync pytest tests/test_all.py -v --tb=short
