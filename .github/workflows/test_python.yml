name: Python versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test_python:
    name: ${{ matrix.suite }} — Python ${{ matrix.python }}, ${{ matrix.pyarrow && 'with' || 'without' }} pyarrow
    # The multi-engine, no-pyarrow merge job uses slow row-by-row staging loads.
    timeout-minutes: ${{ matrix.suite == 'merge' && 90 || 30 }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python: without pyarrow and before 3.12 COPY is not used, the staging table loads row by row.
          - {python: '3.10', pyarrow: false, engines: 'sqlite,postgres', suite: 'merge'}
          - {python: '3.10', pyarrow: false, engines: 'sqlite,postgres', suite: 'tracking'}
          # Without pyarrow on 3.12+: COPY writes its CSV with the csv module, DuckDB loads row by row.
          - {python: '3.12', pyarrow: false, engines: 'sqlite,duckdb,postgres,postgres-psycopg,postgres-pg8000', suite: 'merge'}
          - {python: '3.12', pyarrow: false, engines: 'sqlite,duckdb,postgres,postgres-psycopg,postgres-pg8000', suite: 'tracking'}
          # The newest Python.
          - {python: '3.15', pyarrow: true, engines: 'sqlite,duckdb,postgres', suite: 'merge'}
          - {python: '3.15', pyarrow: true, engines: 'sqlite,duckdb,postgres', suite: 'tracking'}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbmerge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Not "uv sync": uv.lock pins packages that have no wheels for every Python here (pyarrow 25, pyodbc
      # on 3.15), and its dev extra brings pyarrow in. The latest releases are installed instead, as a user
      # of that Python gets them.
      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e . pytest pandas polars numpy duckdb_engine psycopg2-binary "psycopg[binary]" pg8000
          if [ "${{ matrix.pyarrow }}" = "true" ]; then uv pip install pyarrow; fi

      - name: Show versions
        run: |
          uv run --no-sync python -c "import sys, importlib.util, sqlalchemy, pandas, polars; print(sys.version, 'SQLAlchemy', sqlalchemy.__version__, 'pandas', pandas.__version__, 'polars', polars.__version__, 'pyarrow', importlib.util.find_spec('pyarrow') is not None)"
          uv run --no-sync python -c "import importlib.util; assert (importlib.util.find_spec('pyarrow') is not None) == ${{ matrix.pyarrow && 'True' || 'False' }}"

      - name: Create data directory
        run: mkdir -p data

      - name: Public API, documentation, and startup regression checks
        if: matrix.suite == 'tracking'
        env:
          DBMERGE_TEST_ENGINES: sqlite
        run: |
          uv run --no-sync pytest tests/test_public_api.py tests/test_validation.py tests/test_startup.py tests/test_lease_keys.py tests/test_documentation.py tests/test_optional_dependencies.py tests/test_db_hooks.py tests/test_mart_runner.py tests/test_source_condition.py -v --tb=short

      - name: Initialize sample data
        run: |
          uv run --no-sync python tests/sample_data_in_sqlite.py

      - name: Run pytest
        env:
          DBMERGE_TEST_ENGINES: ${{ matrix.engines }}
        run: |
          uv run --no-sync pytest ${{ matrix.suite == 'tracking' && 'tests/test_tracking.py tests/test_mart.py' || 'tests/test_all.py tests/test_source_query.py' }} -v --tb=short --durations=20 -o faulthandler_timeout=180
