name: Test CockroachDB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test_cockroach:
    name: ${{ matrix.engine }}, SQLAlchemy ${{ matrix.sqlalchemy }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine: [cockroachdb, cockroachdb-psycopg]
        sqlalchemy: ['2.0', '2.1']

    steps:
      - uses: actions/checkout@v4

      # CockroachDB needs a custom command ("start-single-node --insecure"), which
      # GitHub Actions "services:" containers cannot override, so we run it directly.
      - name: Start CockroachDB
        run: |
          docker run -d --name cockroach \
            -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:latest-v24.3 \
            start-single-node --insecure

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install DB system libraries
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev libpq-dev

      - name: Install dependencies
        run: |
          uv sync --extra dev

      # uv.lock pins SQLAlchemy 2.0; "uv run --no-sync" below keeps the upgrade.
      # sqlalchemy-cockroachdb 2.0.4 declares SQLAlchemy < 2.1, 2.0.3 is the last release without that limit.
      - name: Install SQLAlchemy 2.1
        if: matrix.sqlalchemy == '2.1'
        run: uv pip install "sqlalchemy~=2.1.0" "sqlalchemy-cockroachdb<2.0.4"

      - name: Create data directory
        run: mkdir -p data

      - name: Initialize sample data
        run: |
          uv run --no-sync python tests/sample_data_in_sqlite.py

      - name: Wait for CockroachDB
        run: |
          for i in $(seq 1 30); do
            if docker exec cockroach cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "CockroachDB is ready"; exit 0
            fi
            echo "waiting for CockroachDB... ($i)"; sleep 2
          done
          echo "CockroachDB did not become ready"; docker logs cockroach; exit 1

      - name: Run pytest
        env:
          DBMERGE_TEST_ENGINES: ${{ matrix.engine }}
        run: |
          uv run --no-sync pytest tests/test_all.py -v --tb=short
